name: nimbus_drive
description: "Nimbus Drive — encrypted cloud storage backed by Telegram."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  file_picker: ^3.0.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled rather than fetched at runtime so the first frame after a
  # cold install renders in the real typeface instead of reflowing once a
  # download lands. Static weights, not the variable file: Flutter only varies
  # a variable axis through `fontVariations`, which would have to be repeated
  # on every style in the type scale.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
