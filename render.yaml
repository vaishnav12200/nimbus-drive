# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Everything here is provisioned for you except the env vars marked
# `sync: false`, which Render prompts for. See docs/SETUP.md for how to
# generate them.

services:
  # --- API ---------------------------------------------------------------
  - name: nimbus-drive-api
    type: web
    runtime: docker
    # `starter` is paid. For a zero-cost trial set this to `free` and delete
    # the preDeployCommand below — see "Running it free" in docs/SETUP.md.
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    # Runs after the build and before the new instance takes traffic.
    # Migrations belong here, not in the start command: the start command runs
    # on every instance, so scaling to N instances would race N migrations.
    # (Pre-deploy commands require a paid instance type.)
    preDeployCommand: alembic upgrade head

    envVars:
      - key: APP_ENV
        value: production

      # Supabase — paste the **Session pooler** string (port 5432) from
      # Project Settings → Database → Connection string.
      #
      #   postgresql://postgres.<ref>:<pw>@aws-<region>.pooler.supabase.com:5432/postgres
      #
      # Not the direct connection (db.<ref>.supabase.co): that is IPv6-only
      # unless you buy the IPv4 add-on. Not the transaction pooler (6543)
      # either — session mode supports prepared statements, which is what a
      # long-lived container like this one wants. The app copes with 6543
      # anyway by disabling them, but session mode is faster.
      #
      # The `postgresql://` scheme and any `sslmode` parameter are rewritten
      # for asyncpg on load, so paste it exactly as Supabase gives it.
      - key: DATABASE_URL
        sync: false

      # Sized for Supabase, not for a dedicated Postgres.
      #
      # A free Supabase project allows 60 connections, 3 reserved for the
      # superuser, and Supabase's own internals already hold ~12. In *session*
      # mode every pooled client connection occupies one server connection for
      # its whole lifetime, so SQLAlchemy's pool maps 1:1 onto that budget.
      #
      # The defaults (10 + 20 overflow) would let a single instance peak at 30
      # — half the database — and two instances would exhaust it outright.
      # Ten is ample for an async metadata API where requests are short.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      - key: REDIS_URL
        fromService:
          name: nimbus-drive-kv
          type: keyvalue
          property: connectionString

      # 32 random bytes, base64 — exactly what SECRET_ENCRYPTION_KEY expects.
      #
      # Back this up the moment it is generated, together with your database.
      # Rotating it makes every stored Telegram bot token undecryptable and
      # forces every user to re-bind their channel.
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true

      # RS256 keypair, generated with the openssl commands in docs/SETUP.md.
      # Paste the PEMs when Render prompts.
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

      # Set once a client origin exists. `*` with credentials allowed is not
      # something to leave running in production.
      - key: CORS_ORIGINS
        sync: false

      # Optional, from https://my.telegram.org. Without these the API still
      # serves everything up to 20 MB but cannot do large files or streaming.
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false

      # Large uploads stage on the instance's ephemeral filesystem, which is
      # writable and wiped on restart — exactly the lifetime a staging file
      # wants. Deliberately *no* Render Disk: a disk would block zero-downtime
      # deploys and horizontal scaling to buy persistence we do not need.
      - key: TEMP_DIR
        value: /var/lib/nimbus/tmp

      # Sized for an instance's ephemeral disk rather than a VPS. Three
      # concurrent 2 GB uploads would want 6 GB of scratch; cap it instead.
      - key: MAX_CONCURRENT_LARGE_UPLOADS
        value: "2"
      - key: MAX_TEMP_DIR_BYTES
        value: "2147483648" # 2 GiB

  # --- Key Value (Redis-compatible) --------------------------------------
  # Optional in the application: it backs access-token revocation on logout
  # and rate limits that hold across replicas. Without it both degrade rather
  # than break — but at this price it is a poor thing to skip.
  - name: nimbus-drive-kv
    type: keyvalue
    plan: starter
    region: oregon
    ipAllowList: [] # private network only; nothing external needs to reach it
    maxmemoryPolicy: allkeys-lru

# No `databases:` block: PostgreSQL is Supabase, wired in via DATABASE_URL
# above. Redis stays on Render so it is reachable over the private network
# rather than the public internet on every rate-limit check.

