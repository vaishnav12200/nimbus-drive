[project]
name = "nimbus-drive-backend"
version = "0.1.0"
description = "Metadata API for Nimbus Drive — Telegram-backed personal cloud storage"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations on mutable defaults; noisy for pydantic
    "N811",    # `UUID as PgUUID` is the conventional SQLAlchemy dialect alias
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["telethon.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one event loop: asyncpg connections are bound to
# the loop that opened them, and a session-scoped engine handed to a
# function-scoped loop fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live PostgreSQL instance",
]
filterwarnings = ["ignore::DeprecationWarning:telethon.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
