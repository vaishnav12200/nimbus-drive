[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped revision filenames sort chronologically, which makes the migration
# history readable without opening every file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is intentionally absent: alembic/env.py reads DATABASE_URL from
# the application settings so there is exactly one place a connection string
# lives.

# `ruff` ships as a binary rather than a console_scripts entry point, so the
# hook has to exec it instead of importing it.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
