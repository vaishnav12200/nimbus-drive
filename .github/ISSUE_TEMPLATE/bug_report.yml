name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please do not paste secrets.** Bot tokens, `DATABASE_URL`, JWT keys
        and `SECRET_ENCRYPTION_KEY` are all credentials. Logs are safe — the
        logging pipeline redacts credential-shaped values and hashes user ids.

        For a security vulnerability, do not open an issue at all — see the
        security section of CONTRIBUTING.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Bind a channel
        2. Upload a 30 MB video
        3. Seek to the middle
        4. Playback stalls
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where is it?
      options:
        - Backend — auth
        - Backend — files, upload or download
        - Backend — folders, search or sync
        - Backend — Telegram integration
        - Backend — encryption
        - Backend — deployment or config
        - Mobile app
        - Docs
        - Not sure
    validations:
      required: true

  - type: input
    id: request-id
    attributes:
      label: X-Request-ID
      description: >
        Every API response carries this header and it matches the server log
        line for that exact request. It makes a bug far faster to find.
      placeholder: 71ab8e06-fc53-4c70-b5c8-2e83ffb0aff6

  - type: textarea
    id: error
    attributes:
      label: Error response or log output
      description: >
        The full error envelope if you have it — `error.code` is the useful
        part. Rendered as a code block, no backticks needed.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Deployment: (Render free / Render paid / self-hosted / local docker)
        - Database: (Supabase / Render Postgres / own Postgres — version)
        - Redis: (yes / no)
        - TELEGRAM_API_ID set: (yes / no — affects files over 20 MB)
        - App version or commit:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: I have removed every token, password and connection string
          required: true
